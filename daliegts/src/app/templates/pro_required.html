{% extends "base.html" %}
{% block title %}DaLiegt’s Pro{% endblock %}
{% block content %}
<div class="card" style="max-width:620px;border-left:4px solid #6b4fd8">
  <h1 class="mt0">DaLiegt’s Pro <span class="badge pro">Pro</span></h1>
  <p>{{ message }}</p>
  <p class="small muted">Mit Pro dazu:</p>
  <ul class="small" style="padding-left:18px">{% for k, v in features.items() %}<li{% if k == feature %} style="font-weight:700"{% endif %}>{{ v }}</li>{% endfor %}</ul>
  <div class="row">
    {% if me and me.can('system', 1) %}<a class="btn primary" href="/admin/lizenz">🔑 Lizenz eingeben</a>{% endif %}
    <a class="btn ghost" href="javascript:history.back()">← zurück</a>
  </div>
</div>
{% endblock %}
