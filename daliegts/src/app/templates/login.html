{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<div style="max-width:420px;margin:6vh auto">
  <div class="card">
    <h1>Anmelden</h1>
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Benutzername</label><input name="username" autocomplete="username" autofocus required>
      <label>Passwort</label><input type="password" name="password" autocomplete="current-password" required>
      <label class="inline" style="margin:10px 0"><input type="checkbox" name="remember" value="true" checked> angemeldet bleiben</label>
      <button class="btn primary" style="width:100%">Anmelden</button>
    </form>
  </div>
  {% if pin_users %}
  <div class="card" x-data="{uid: null, name: ''}">
    <h2 class="mt0">Schnellanmeldung</h2>
    <div class="row">
      {% for u in pin_users %}<button type="button" class="btn" @click="uid={{ u.id }}; name='{{ u.label }}'; $nextTick(()=>$refs.pin.focus())">{{ u.label }}</button>{% endfor %}
    </div>
    <form method="post" action="/login/pin" x-show="uid" style="margin-top:10px">
      <input type="hidden" name="user_id" :value="uid"><input type="hidden" name="next" value="{{ next }}">
      <label>PIN für <b x-text="name"></b></label>
      <input x-ref="pin" type="password" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" required>
      <button class="btn primary" style="width:100%;margin-top:8px">Los</button>
    </form>
  </div>
  {% endif %}
  {% if guest %}<p class="muted small">Gastzugang ist aktiv – <a href="/suche">ohne Anmeldung suchen</a>.</p>{% endif %}
</div>
{% endblock %}
